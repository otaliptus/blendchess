name: Deploy Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check browser files
        run: |
          for file in chess-core.js app.js shared/*.js client/*.js; do
            node --check "$file"
          done

      - name: Server tests (engine, room logic, session, Node end-to-end)
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Worker tests
        working-directory: ws-worker
        run: |
          npm ci
          npm test

      - name: End-to-end against wrangler dev
        run: |
          (cd ws-worker && npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health && break; sleep 1; done
          cd server && E2E_URL=ws://127.0.0.1:8787 node --test tests/server-e2e.test.mjs

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Pages (production)
        run: npx wrangler pages deploy . --project-name blendchess --branch production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
