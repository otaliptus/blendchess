name: Deploy Cloudflare

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check core files
        run: |
          node --check chess-core.js
          node --check app.js
          node --check client/stateGuards.js

      - name: Verify chess-core sync
        run: diff chess-core.js ws-worker/src/chess-core.js

      - name: Server tests
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Worker tests
        working-directory: ws-worker
        run: |
          npm ci
          npm test

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Pages (production)
        run: npx wrangler pages deploy . --project-name blendchess --branch production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ws-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
